name: CI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Go binary (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Build Go binary (Windows)
        if: runner.os == 'Windows'
        run: |
          .\build.bat

      - name: Verify Go binary exists
        run: |
          ls -la bin/ || dir bin\
        shell: bash

      - name: Run Python (smoke test)
        run: |
          python -c "import rich, questionary; print('Imports OK')"
        shell: bash